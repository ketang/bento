name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build generated plugins
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            BENTO_SKIP_VERIFY=1 scripts/build-plugins
          else
            BENTO_SKIP_VERIFY=1 BENTO_SKIP_CLAUDE_VALIDATE=1 scripts/build-plugins
          fi

      - name: Check generated artifact drift
        run: scripts/build-plugins --check

      - name: Run tests with explicit skip policy
        run: scripts/run-tests-with-skip-policy.py

      - name: Check documented CLI argument parity
        run: scripts/check-cli-arg-parity

      - name: Check for unanchored temporal claims
        run: scripts/check-temporal-claims

      - name: Check hook cwd-from-stdin contract
        run: scripts/check-hook-contract
